name: Update CN routes (every 2 hours)

on:
  schedule:
    - cron: "0 */2 * * *"   # UTC, every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cnroutes-update
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libboost-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Generate outputs (with retry)
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i..."
            ./build/cnroutes_aggregator \
              --v4-url "https://chnroutes2.cdn.skk.moe/chnroutes.txt" \
              --v4-proto "chnroutes2-optimized" \
              --v6-url "https://ruleset.skk.moe/Clash/ip/china_ip_ipv6.txt" \
              --v6-proto "ruleset.skk.moe" \
              --out-dir "dist" && break
            echo "Attempt $i failed."
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep 30
          done

      - name: Validate outputs
        run: |
          for f in dist/ip4.txt dist/ip6.txt dist/cn4.nft dist/cn6.nft; do
            if [ ! -s "$f" ]; then
              echo "ERROR: output file missing or empty: $f" >&2
              exit 1
            fi
            echo "OK: $f ($(wc -l < "$f") lines)"
          done

      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cnroutes-latest --yes --cleanup-tag || true

      - name: Release (stable, recreate)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "cnroutes-latest"
          name: "CN Routes (auto)"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/ip4.txt
            dist/ip6.txt
            dist/cn4.nft
            dist/cn6.nft
